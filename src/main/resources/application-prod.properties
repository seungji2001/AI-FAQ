# ─── Database ────────────────────────────────────────────────
spring.datasource.driver-class-name=${JDBC_DATABASE_DRIVER:com.mysql.cj.jdbc.Driver}
spring.datasource.url=${JDBC_DATABASE_URL:jdbc:mysql://mysql:3306/plateer_portfolio?useSSL=false&serverTimezone=Asia/Seoul&characterEncoding=UTF-8&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

# ─── JPA (운영: DDL 변경 금지) ──────────────────────────────
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:none}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=${HIBERNATE_DIALECT:org.hibernate.dialect.MySQLDialect}

# Existing demo schemas are baselined at V1; managed changes start at V2.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.locations=classpath:db/migration

# ─── Redis ───────────────────────────────────────────────────
spring.data.redis.host=${REDIS_HOST:redis}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.connect-timeout=${REDIS_CONNECT_TIMEOUT:500ms}
spring.data.redis.timeout=${REDIS_TIMEOUT:500ms}
spring.cache.type=${CACHE_TYPE:simple}
management.health.redis.enabled=false

# FO web instances do not need the FAQ batch infrastructure.
thingz.batch.enabled=${BATCH_ENABLED:false}
spring.autoconfigure.exclude=${SPRING_AUTOCONFIGURE_EXCLUDE:org.springframework.boot.autoconfigure.batch.BatchAutoConfiguration,org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration,org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration}

# ─── JWT ─────────────────────────────────────────────────────
jwt.secret=${JWT_SECRET}

# ─── Kakao OAuth2 ────────────────────────────────────────────
spring.security.oauth2.client.registration.kakao.client-id=${KAKAO_CLIENT_ID}
spring.security.oauth2.client.registration.kakao.client-secret=${KAKAO_CLIENT_SECRET}
spring.security.oauth2.client.registration.kakao.redirect-uri=${KAKAO_REDIRECT_URI}

# ─── AWS S3 ──────────────────────────────────────────────────
cloud.aws.credentials.access-key=${AWS_ACCESS_KEY}
cloud.aws.credentials.secret-key=${AWS_SECRET_KEY}
cloud.aws.region.static=${AWS_REGION:ap-northeast-2}
cloud.aws.s3.bucket=${S3_BUCKET}

# ─── OpenAI ──────────────────────────────────────────────────
openai.api.key=${OPENAI_API_KEY}
openai.model=${OPENAI_MODEL:gpt-4o-mini}

# ─── CORS (운영 도메인으로 변경) ─────────────────────────────
frontend.url=${FRONTEND_URL:http://localhost:3000}

# Render injects PORT for the web service listener.
server.port=${PORT:8080}

# ─── 로깅 (운영: SQL 파라미터/쿼리 평문 로깅 차단) ───────────
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN
logging.level.org.springframework.jdbc=WARN
logging.level.org.springframework.batch=INFO
logging.level.org.springframework.transaction=WARN
logging.level.com.plateer.thingz.bo.mapper=INFO
logging.level.com.plateer.thingz.batch=INFO
logging.pattern.level=%5p [requestId:%X{requestId:-}]
