<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BO - 홈</title>
    <link rel="stylesheet" th:href="@{/bo/css/home.css}">
</head>
<body>
<div class="container">
    <!-- 헤더 -->
    <header class="header">
        <div class="logo">
            <h1>🏢 Back Office</h1>
            <p class="subtitle">AI FAQ 관리 시스템</p>
        </div>
    </header>

    <!-- 메인 컨텐츠 -->
    <main class="main-content">
        <div class="welcome-section">
            <h2>환영합니다! 👋</h2>
            <p>AI 기반 FAQ 자동 생성 및 관리 시스템입니다.</p>
        </div>

        <!-- 메뉴 카드 -->
        <div class="menu-grid">
            <!-- FAQ 관리 -->
            <div class="menu-card" onclick="location.href='/bo/faq/list'">
                <div class="card-icon">📋</div>
                <h3>FAQ 관리</h3>
                <p>FAQ 목록 조회 및 상세 내역 확인</p>
                <div class="card-arrow">→</div>
            </div>

            <!-- 프로그램 관리 -->
            <div class="menu-card" onclick="location.href='/bo/program/list'">
                <div class="card-icon">📺</div>
                <h3>프로그램 관리</h3>
                <p>방송 프로그램 정보 관리</p>
                <div class="card-arrow">→</div>
            </div>

            <!-- 통계 (준비중) -->
            <div class="menu-card disabled">
                <div class="card-icon">📊</div>
                <h3>통계</h3>
                <p>FAQ 생성 및 사용 통계</p>
                <div class="card-badge">준비중</div>
            </div>

            <!-- 설정 (준비중) -->
            <div class="menu-card disabled">
                <div class="card-icon">⚙️</div>
                <h3>설정</h3>
                <p>시스템 설정 및 환경 구성</p>
                <div class="card-badge">준비중</div>
            </div>
        </div>

        <!-- 최근 활동 -->
        <div class="recent-activity">
            <h3>🔔 최근 활동</h3>
            <div class="activity-list">
                <div class="activity-item">
                    <span class="activity-time">방금 전</span>
                    <span class="activity-content">시스템에 접속했습니다.</span>
                </div>
            </div>
        </div>
    </main>

    <!-- 푸터 -->
    <footer class="footer">
        <p>&copy; 2024 AI FAQ Management System. All rights reserved.</p>
    </footer>
</div>
</body>
</html>
