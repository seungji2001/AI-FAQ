spring.application.name=AI-FAQ

server.port=8080

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/plateer_portfolio?useSSL=false&serverTimezone=Asia/Seoul&characterEncoding=UTF-8&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000

mybatis.mapper-locations=classpath:mappers/**/*.xml
mybatis.type-aliases-package=com.plateer.aifaq.bo.dto,com.plateer.aifaq.bo.dto.request, com.plateer.aifaq.batch.dto
mybatis.configuration.map-underscore-to-camel-case=true

logging.level.com.plateer.aifaq.bo.mapper=DEBUG
logging.level.org.springframework.jdbc=DEBUG

spring.devtools.restart.enabled=true

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

spring.batch.job.enabled=false
spring.batch.jdbc.initialize-schema=always

# ?? ?? ???
logging.level.com.plateer.aifaq.batch=DEBUG
logging.level.com.plateer.aifaq.batch.tasklet.AiSummarizationTasklet=DEBUG

# ??? ??
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

spring.profiles.include=secure

# AWS S3 (credentials in application-secure.properties)
cloud.aws.credentials.access-key=
cloud.aws.credentials.secret-key=
cloud.aws.region.static=ap-northeast-2
cloud.aws.s3.bucket=

# Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.password=
spring.data.redis.timeout=3000ms

# Swagger
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui
springdoc.swagger-ui.tags-sorter=alpha

# Spring Batch ?? ?? ??
logging.level.org.springframework.batch=DEBUG
logging.level.org.springframework.transaction=DEBUG
# ?? ??? ??
logging.level.com.yourpackage=DEBUG

# SQL ?? ??
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE