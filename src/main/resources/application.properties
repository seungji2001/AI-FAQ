spring.application.name=AI-FAQ

# Server Port (????)
server.port=8080

# MySQL ?? ??
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/plateer_portfolio?useSSL=false&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=

# HikariCP ?? (Connection Pool)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000

# MyBatis ??
mybatis.mapper-locations=classpath:mappers/**/*.xml
mybatis.type-aliases-package=com.plateer.aifaq.bo.dto,com.plateer.aifaq.bo.dto.request
mybatis.configuration.map-underscore-to-camel-case=true

# SQL ?? ??
logging.level.com.plateer.aifaq.bo.mapper=DEBUG
logging.level.org.springframework.jdbc=DEBUG

# ?? ?? ??
spring.devtools.restart.enabled=true

spring.batch.job.enabled=false
spring.batch.jdbc.initialize-schema=always