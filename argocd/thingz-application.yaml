apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: thingz
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/seungji2001/THINGZ.git
    targetRevision: develop
    path: k8s/base
  destination:
    server: https://kubernetes.default.svc
    namespace: thingz
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

