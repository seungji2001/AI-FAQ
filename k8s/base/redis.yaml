apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: thingz-redis-data
  namespace: thingz
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: thingz-redis
  namespace: thingz
spec:
  replicas: 1
  selector:
    matchLabels:
      app: thingz-redis
  template:
    metadata:
      labels:
        app: thingz-redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          args:
            - redis-server
            - --maxmemory
            - 256mb
            - --maxmemory-policy
            - allkeys-lru
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 300m
              memory: 384Mi
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: thingz-redis-data
---
apiVersion: v1
kind: Service
metadata:
  name: thingz-redis
  namespace: thingz
spec:
  selector:
    app: thingz-redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis

