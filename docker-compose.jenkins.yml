services:
  jenkins:
    build:
      context: ./jenkins
      dockerfile: Dockerfile
    container_name: jenkins
    restart: unless-stopped
    user: root
    environment:
      - JAVA_OPTS=-Djenkins.install.runSetupWizard=false
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock   # 호스트 Docker 소켓 공유
    ports:
      - "9090:8080"       # Jenkins UI: http://localhost:9090
      - "50000:50000"     # Jenkins 에이전트 포트
    networks:
      - jenkins-net

  # GitHub 웹훅을 로컬 Jenkins로 전달하는 터널
  ngrok:
    image: ngrok/ngrok:latest
    container_name: ngrok
    restart: unless-stopped
    command: http jenkins:8080 --log stdout
    environment:
      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN}
    ports:
      - "4040:4040"       # ngrok 대시보드: http://localhost:4040
    depends_on:
      - jenkins
    networks:
      - jenkins-net

volumes:
  jenkins_home:

networks:
  jenkins-net:
    driver: bridge
