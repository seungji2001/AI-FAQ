services:
  jenkins:
    image: jenkins/jenkins:lts
    container_name: jenkins
    restart: unless-stopped
    user: root                              # Docker 소켓 접근을 위해 root 사용
    environment:
      - JAVA_OPTS=-Djenkins.install.runSetupWizard=false
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock   # 호스트 Docker 소켓 공유
      - /usr/bin/docker:/usr/bin/docker              # Docker CLI 공유
    ports:
      - "9090:8080"       # Jenkins 웹 UI: http://localhost:9090
      - "50000:50000"     # Jenkins 에이전트 포트
    networks:
      - jenkins-net

volumes:
  jenkins_home:

networks:
  jenkins-net:
    driver: bridge
